<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Black rounded square base -->
  <rect width="512" height="512" fill="#000000" rx="112"/>

  <!-- Inner subtle frame -->
  <rect x="37" y="37" width="438" height="438" rx="86" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- SUN -->
  <g transform="translate(160, 170)">
    <g stroke="white" stroke-width="5" stroke-linecap="square">
      <line x1="0" y1="-80" x2="0" y2="-58"/>
      <line x1="0" y1="58" x2="0" y2="80"/>
      <line x1="-80" y1="0" x2="-58" y2="0"/>
      <line x1="58" y1="0" x2="80" y2="0"/>
      <line x1="-56" y1="-56" x2="-41" y2="-41"/>
      <line x1="41" y1="41" x2="56" y2="56"/>
      <line x1="56" y1="-56" x2="41" y2="-41"/>
      <line x1="-41" y1="41" x2="-56" y2="56"/>
    </g>
    <circle cx="0" cy="0" r="42" fill="none" stroke="white" stroke-width="6.5"/>
    <circle cx="0" cy="0" r="8" fill="white"/>
  </g>

  <!-- CLOUD -->
  <g transform="translate(299, 240)">
    <path d="M -75 22 L -75 -5 A 27 27 0 0 1 -48 -32 A 32 32 0 0 1 0 -43 A 37 37 0 0 1 48 -22 A 22 22 0 0 1 64 0 L 64 22 Z"
      fill="black" stroke="white" stroke-width="6.5" stroke-linejoin="miter"/>
  </g>

  <!-- WX wordmark -->
  <text x="256" y="422" text-anchor="middle"
    font-family="'Courier New', monospace"
    font-size="74" font-weight="700"
    fill="white" letter-spacing="16">WX</text>

  <!-- Dot grid top right -->
  <g fill="white" opacity="0.4">
    <circle cx="416" cy="86" r="4"/>
    <circle cx="395" cy="86" r="4"/>
    <circle cx="416" cy="107" r="4"/>
  </g>

  <!-- Tick marks bottom left -->
  <g stroke="white" stroke-width="2.5" opacity="0.4">
    <line x1="74" y1="416" x2="96" y2="416"/>
    <line x1="74" y1="427" x2="85" y2="427"/>
  </g>
</svg>