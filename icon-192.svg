<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Black base with iOS rounded corners (22%) -->
  <rect width="192" height="192" fill="#000000" rx="42"/>

  <!-- Inner subtle frame for retro-futurist feel -->
  <rect x="10" y="10" width="172" height="172" rx="34" fill="none" stroke="#1f1f1f" stroke-width="1"/>

  <!-- Corner brackets — instrument vibe -->
  <g stroke="#3a3a3a" stroke-width="1.5" fill="none" stroke-linecap="square">
    <path d="M20 28 L20 20 L28 20"/>
    <path d="M172 20 L164 20"/>
    <path d="M172 28 L172 20"/>
    <path d="M20 164 L20 172 L28 172"/>
    <path d="M172 172 L164 172"/>
    <path d="M172 164 L172 172"/>
  </g>

  <!-- SUN: large, centered slightly upper-left -->
  <g transform="translate(78, 80)">
    <!-- Outer geometric rays -->
    <g stroke="white" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-52" x2="0" y2="-40"/>
      <line x1="0" y1="40" x2="0" y2="52"/>
      <line x1="-52" y1="0" x2="-40" y2="0"/>
      <line x1="40" y1="0" x2="52" y2="0"/>
      <line x1="-37" y1="-37" x2="-28" y2="-28"/>
      <line x1="28" y1="28" x2="37" y2="37"/>
      <line x1="37" y1="-37" x2="28" y2="-28"/>
      <line x1="-28" y1="28" x2="-37" y2="37"/>
    </g>
    <!-- Sun disc -->
    <circle cx="0" cy="0" r="26" fill="white" stroke="none"/>
    <!-- Inner contrast -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="#000" stroke-width="2"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="6" fill="#000"/>
  </g>

  <!-- CLOUD: bottom right, overlapping sun -->
  <g transform="translate(122, 124)">
    <!-- Cloud shadow (slight offset for depth) -->
    <path d="M -38 14 L -38 0 A 14 14 0 0 1 -24 -14 A 18 18 0 0 1 0 -22 A 20 20 0 0 1 26 -10 A 12 12 0 0 1 36 4 L 36 14 Z"
      fill="black" stroke="white" stroke-width="3.5" stroke-linejoin="miter"/>
    <!-- Cloud highlight line at the top -->
    <path d="M -22 -10 L 22 -18"
      stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.4" fill="none"/>
  </g>

  <!-- Micro tick marks at the bottom — instrument detail -->
  <g stroke="#444" stroke-width="1" stroke-linecap="square">
    <line x1="78" y1="170" x2="78" y2="174"/>
    <line x1="88" y1="170" x2="88" y2="174"/>
    <line x1="96" y1="170" x2="96" y2="174"/>
    <line x1="104" y1="170" x2="104" y2="174"/>
    <line x1="114" y1="170" x2="114" y2="174"/>
  </g>

  <!-- Small accent dot — retro-tech feel -->
  <circle cx="160" cy="40" r="2.5" fill="#FFD700"/>
</svg>